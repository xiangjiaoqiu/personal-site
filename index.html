<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端优先：视口设置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO 基础 -->
  <title>香蕉球 · 深圳大学本科生 | 个人主页</title>
  <meta name="description" content="香蕉球的个人主页——深圳大学本科生，坐标深圳。了解我的技能、项目与经历，欢迎联系交流。">
  <meta name="author" content="香蕉球">
  <meta name="keywords" content="香蕉球, 深圳大学, 本科生, 个人主页">

  <!-- 站点规范地址 -->
  <link rel="canonical" href="https://xiangjiaoqiu.github.io/personal-site/">

  <!-- Open Graph（社交媒体分享卡片） -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xiangjiaoqiu.github.io/personal-site/">
  <meta property="og:title" content="香蕉球 · 深圳大学本科生">
  <meta property="og:description" content="帅气逼人的深圳大学本科生。了解我的技能、项目与经历，欢迎联系交流。">
  <meta property="og:image" content="https://xiangjiaoqiu.github.io/personal-site/assets/avatar.svg">
  <meta property="og:locale" content="zh_CN">

  <!-- Favicon：内嵌 SVG，香蕉主题 -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- 主题色（随深浅模式变化，由 JS 同步） -->
  <meta name="theme-color" content="#4f46e5">

  <!-- 深色模式：在 CSS 加载前设置，避免闪烁 -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="styles.css">

  <!-- 禁用 JS 时的兜底：让滚动淡入元素直接可见 -->
  <noscript>
    <style>
      .reveal { opacity: 1; transform: none; }
    </style>
  </noscript>
</head>
<body>

  <!-- ===================== 顶部导航（全站共用，当前页高亮） ===================== -->
  <header class="site-header">
    <nav class="nav container" aria-label="主导航">
      <a class="nav__logo" href="index.html" aria-label="回到首页">香蕉球</a>

      <!-- 汉堡按钮（移动端） -->
      <button id="nav-toggle" class="nav__toggle" type="button"
              aria-expanded="false" aria-controls="nav-menu"
              aria-label="打开菜单">
        <span class="nav__toggle-bar" aria-hidden="true"></span>
        <span class="nav__toggle-bar" aria-hidden="true"></span>
        <span class="nav__toggle-bar" aria-hidden="true"></span>
      </button>

      <ul id="nav-menu" class="nav__menu">
        <li><a class="nav__link" href="index.html" aria-current="page">首页</a></li>
        <li><a class="nav__link" href="about.html">关于</a></li>
        <li><a class="nav__link" href="skills.html">技能</a></li>
        <li><a class="nav__link" href="projects.html">项目</a></li>
        <li><a class="nav__link" href="experience.html">经历</a></li>
        <li><a class="nav__link" href="contact.html">联系</a></li>
        <!-- 深色模式切换 -->
        <li>
          <button id="theme-toggle" class="theme-toggle" type="button"
                  aria-label="切换深色 / 浅色模式" title="切换深色 / 浅色模式">
            <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀️</span>
            <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">🌙</span>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===================== Hero 首屏 ===================== -->
    <section id="hero" class="hero container">
      <div class="hero__content reveal">
        <!-- 头像：无真实照片，使用首字母生成的 SVG；替换真实头像后改 src 为 assets/avatar.jpg -->
        <img class="hero__avatar" src="assets/avatar.svg"
             alt="香蕉球的头像（首字母生成的占位头像）" width="128" height="128" decoding="async">

        <h1 class="hero__name">香蕉球</h1>
        <p class="hero__role">深圳大学本科生</p>
        <p class="hero__tagline">帅气逼人</p>
        <p class="hero__location">
          <span aria-hidden="true">📍</span> 深圳
        </p>

        <div class="hero__actions">
          <a class="btn btn--primary" href="projects.html">查看项目</a>
          <a class="btn btn--ghost" href="contact.html">联系我</a>
        </div>
      </div>
    </section>

    <!-- ===================== 站内入口卡片 ===================== -->
    <section class="section container" aria-label="站内导航">
      <div class="home-cards">
        <a class="card home-card reveal" href="about.html">
          <span class="home-card__icon" aria-hidden="true">👤</span>
          <h2 class="home-card__title">关于</h2>
          <p>我是谁，在做什么</p>
        </a>
        <a class="card home-card reveal" href="skills.html">
          <span class="home-card__icon" aria-hidden="true">🧩</span>
          <h2 class="home-card__title">技能</h2>
          <p>我会哪些东西</p>
        </a>
        <a class="card home-card reveal" href="projects.html">
          <span class="home-card__icon" aria-hidden="true">💻</span>
          <h2 class="home-card__title">项目</h2>
          <p>我做过什么</p>
        </a>
        <a class="card home-card reveal" href="experience.html">
          <span class="home-card__icon" aria-hidden="true">🎓</span>
          <h2 class="home-card__title">经历</h2>
          <p>我走过的路</p>
        </a>
        <a class="card home-card reveal" href="contact.html">
          <span class="home-card__icon" aria-hidden="true">✉️</span>
          <h2 class="home-card__title">联系</h2>
          <p>怎么找到我</p>
        </a>
      </div>
    </section>
  </main>

  <!-- ===================== 页脚（全站共用） ===================== -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year">2026</span> 香蕉球 · 深圳</p>
      <p class="site-footer__meta">纯 HTML / CSS / JS 构建 · 托管于 GitHub Pages</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
