<!--
  项目配图：按网站首页真实样式绘制的浏览器窗口示意图（SVG 手绘，无版权问题）。
  如以后有真实截图，替换为 assets/project-1.png 并更新 projects.html 的 src 即可。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="个人网站首页示意图">
  <!-- 页面背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 浏览器窗口 -->
  <rect x="60" y="30" width="680" height="390" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <!-- 标题栏 -->
  <path d="M60 42 a12 12 0 0 1 12-12 h656 a12 12 0 0 1 12 12 v22 H60 Z" fill="#f3f4f6"/>
  <circle cx="84" cy="47" r="5" fill="#f87171"/>
  <circle cx="102" cy="47" r="5" fill="#fbbf24"/>
  <circle cx="120" cy="47" r="5" fill="#34d399"/>
  <!-- 地址栏 -->
  <rect x="150" y="38" width="500" height="18" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="400" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">xiangjiaoqiu.github.io/personal-site</text>

  <!-- 导航栏 -->
  <text x="95" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">香蕉球</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#6b7280">
    <text x="520" y="95">首页</text>
    <text x="560" y="95">关于</text>
    <text x="600" y="95">技能</text>
    <text x="640" y="95">项目</text>
    <text x="680" y="95">经历</text>
    <text x="716" y="95">联系</text>
  </g>
  <circle cx="758" cy="91" r="9" fill="#eef2ff"/>

  <!-- 头像 -->
  <defs>
    <linearGradient id="ava" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="185" r="42" fill="url(#ava)"/>
  <text x="400" y="185" text-anchor="middle" dominant-baseline="central"
        font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">香</text>

  <!-- 姓名与身份 -->
  <text x="400" y="258" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#1e293b">香蕉球</text>
  <text x="400" y="284" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#4f46e5">深圳大学本科生</text>
  <text x="400" y="306" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">📍 深圳</text>

  <!-- 按钮 -->
  <rect x="300" y="330" width="110" height="34" rx="17" fill="#4f46e5"/>
  <text x="355" y="351" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">查看项目</text>
  <rect x="390" y="330" width="110" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="445" y="351" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#374151">联系我</text>
</svg>
